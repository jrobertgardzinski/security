name: CI

# The SHARED KERNEL workspace: identity + channels + every shared library. A pure aggregator —
# the sub-projects live in their own repos (gitignored here), so CI mirrors what a developer
# does locally: check each sub-repo out into its module directory, then let the reactor build
# and test everything in dependency order with one command.
#
# The two PRODUCTS have their own workspaces and CIs (workspace-portal, workspace-formula);
# they consume this kernel through ~/.m2, so nothing product-flavoured builds here.
#
# The sub-repos are checked out with REPO_PAT — a fine-grained PAT with Contents:read on the
# sub-repos — because some are private and the default GITHUB_TOKEN only reads this repo.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Eight of the aggregated library repos — voting, config, password, email, constraint (repo
  # "libs"), test-starter, adjustable-clock, infrastructure-micronaut-clock — carry no workflow
  # of their own, and most of them cannot: their siblings' 1.0.0-SNAPSHOT artifacts exist only
  # in this reactor, never in any registry, so a lone `mvn verify` in such a repo dies on a
  # missing dependency. A push to any of the eight therefore triggers no CI anywhere, and a
  # regression there used to surface only on the next unrelated push HERE — weeks later, with
  # the culprit long merged. The nightly run bounds that silence to a day: every sub-repo is
  # checked out at main and the full reactor runs WITH tests.
  schedule:
    - cron: '17 3 * * *'

jobs:
  reactor:
    runs-on: ubuntu-latest
    # the same ceiling and the same reasoning as portal/ci.yml: a wedged build must not sit here
    # for six hours. Added on 2026-07-29 — the timeouts had been applied selectively.
    timeout-minutes: 30
    steps:
      - name: Checkout workspace (aggregator)
        uses: actions/checkout@v7

      # The 13 aggregated sub-repos, each into the directory the aggregator pom expects.
      # Pinned to main. A sub-repo feature branch is validated in its own repo's checks — where
      # it has any: eight of the thirteen have no workflow at all, which is what the schedule
      # trigger above is for.
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/adjustable-clock
          path: adjustable-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/infrastructure-micronaut-clock
          path: infrastructure-micronaut-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/transactional-outbox
          path: transactional-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/infrastructure-spring-outbox
          path: infrastructure-spring-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/voting
          path: voting
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/offline-jwt
          path: offline-jwt
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/test-starter
          path: test-starter
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/libs   # the constraint lib lives in repo "libs"
          path: constraint
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/config
          path: config
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/email
          path: email
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/password
          path: password
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-security
          path: microservice-security
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-email
          path: microservice-email
          token: ${{ secrets.REPO_PAT }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test the shared kernel
        run: ./mvnw -B --no-transfer-progress clean install

  # The same Gherkin specs, driven through a real browser (cucumber-js + Playwright) against
  # the security service and its React UI. Only the modules the security jar needs are built
  # (-am closure), tests skipped — the reactor job owns those.
  # The three Python services had suites that passed and that NOTHING ran: this workflow checked out
  # eleven Java repositories and never these, and its only run: steps were Maven, npm and Playwright.
  # A regression in the stub IdP or in either notification channel sailed through a green build — and
  # those are the services carrying the OIDC dance and the MFA code delivery. Stdlib unittest, so the
  # job needs no dependencies at all and costs seconds.
  python-stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-idp
          path: microservice-idp
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-sms
          path: microservice-sms
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-push
          path: microservice-push
          token: ${{ secrets.REPO_PAT }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stub IdP — the OIDC dance, the header-splitting guard and the code store's ceiling
        run: python -m unittest -v
        working-directory: microservice-idp
      - name: SMS channel — validation, the API key, and what the log may not carry
        run: python -m unittest -v
        working-directory: microservice-sms
      - name: Push channel — the same, for the other notification adapter
        run: python -m unittest -v
        working-directory: microservice-push

  e2e:
    runs-on: ubuntu-latest
    # the browser suite stands a real stack up; 60 is the honest ceiling, as in portal/ci.yml
    timeout-minutes: 60
    steps:
      - name: Checkout workspace (aggregator)
        uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/adjustable-clock
          path: adjustable-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/infrastructure-micronaut-clock
          path: infrastructure-micronaut-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/transactional-outbox
          path: transactional-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/infrastructure-spring-outbox
          path: infrastructure-spring-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/voting
          path: voting
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/offline-jwt
          path: offline-jwt
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/test-starter
          path: test-starter
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/libs   # the constraint lib lives in repo "libs"
          path: constraint
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/config
          path: config
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/email
          path: email
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/password
          path: password
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-security
          path: microservice-security
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-email
          path: microservice-email
          token: ${{ secrets.REPO_PAT }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the security jar (deps closure, no tests)
        run: ./mvnw -B -q --no-transfer-progress -pl microservice-security/security-infrastructure -am package -DskipTests

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: microservice-security/security-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: microservice-security/security-ui
      # Cheap and first: the error model is pure decision-making ("what does this status mean to a
      # person?") and every one of its rules used to be an unwritten else that told users their
      # password was wrong when the database was down. No browser, no stack — seconds.
      - name: Unit-test the UI's error model (security-ui)
        run: npm test
        working-directory: microservice-security/security-ui
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: microservice-security/security-ui
      - name: Drive the shared specs through the browser (security-ui)
        run: ./run-e2e.sh
        working-directory: microservice-security/security-ui
      - name: Upload service/UI logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: /tmp/*-e2e-*.log
