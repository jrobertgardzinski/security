# The stack's metrics scrape (see docker-compose.yml: prometheus/grafana/cadvisor/node-exporter).
# Today's targets need NO code changes: cAdvisor sees every container, node-exporter the host.
# Per-service /metrics endpoints join here as the sub-repos grow them (workspace todo.md).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # --- the services' own /metrics, as the sub-repos grow them (workspace todo.md, etap 2)
  - job_name: security
    metrics_path: /prometheus
    static_configs:
      - targets: ["security:8080"]

  - job_name: race-sim
    static_configs:
      - targets: ["race-sim:8090"]

  - job_name: email
    metrics_path: /q/metrics
    static_configs:
      - targets: ["email:8080"]

  # The MANAGEMENT ports, not the request ports. Both services put their actuator on a connector
  # of its own (management.server.port), so /actuator/prometheus does not exist on 8083 or 8085 at
  # all. memes moved on 2026-07-29 and this file was last touched on 07-11, so for the whole of
  # that day the memes job scraped a 404.
  #
  # To be precise about how loud that is: `up` goes to 0 on a failed scrape, so the TargetDown rule
  # in alert-rules.yml does fire after two minutes — on Prometheus's own /alerts page and in
  # Grafana. What it does NOT do is reach anyone: this stack runs no Alertmanager on purpose
  # ("nobody pages a hobbyist at 3 a.m."), no build fails and no probe goes red, so the practical
  # symptom is dashboards with no memes in them until somebody happens to look at /alerts.
  # A scrape target is configuration with no test and no user; if either service's
  # management.server.port changes, this line changes with it.
  - job_name: memes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["memes:9083"]

  - job_name: comments
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["comments:9085"]

  - job_name: paddock
    static_configs:
      - targets: ["paddock:8086"]

  - job_name: formula
    static_configs:
      - targets: ["formula:8084"]

  - job_name: user-collections
    static_configs:
      - targets: ["user-collections:8092"]
  - job_name: offboarding
    static_configs:
      - targets: ["offboarding:8094"]
