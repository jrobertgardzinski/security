# The DEPLOYMENT level of the configuration ladder for the security service, as a file the
# operator edits on the host: docker-compose.identity.yml mounts this directory read-only and
# points Micronaut at it (MICRONAUT_CONFIG_FILES), so a value here is read on the next
# `docker compose restart security` — no image rebuild. Keys are the same names as in
# application.yml; an absent (commented) key is a VACANT level and the hardcoded default answers.
# Precedence: security_settings row (live) > this file / env var (restart) > default (rebuild).

# security.password.policy.min.length=8
