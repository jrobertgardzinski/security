# The IDENTITY STACK — the shared kernel both products sign in through: the auth service (with
# its Postgres), the mail chain (email service -> Mailpit, whose web UI at http://localhost:8025
# shows every mail sent), the stub OIDC provider (social login without Google), the notification
# channel stubs (sms — also security's MFA SMS factor — and push), and Kafka as the event
# backbone (mail requests from the outbox, the account-deletion saga).
#
# Products include this file from their own compose (portal/docker-compose.yml,
# formula/docker-compose.yml) — the identity services are defined ONCE, here.
#
# RESTART POLICY: every service here carries `restart: unless-stopped`, because Docker brings a
# container back on daemon start ONLY for `always` or `unless-stopped` — `depends_on` is a
# `compose up` concept and does nothing on a host reboot. Without it a 3 a.m. reboot came back
# with HALF a stack: the products' own services and databases returned (they carry `always`), but
# no Kafka (sagas dead), no security (every write introspects into a hole) and no mail. The policy
# lives HERE, next to the definitions, so both products inherit it — portal used to bolt it on as
# an override, which only newer Compose merges and which formula never got at all.
#
# What that sentence covers, precisely: the services DEFINED IN THIS FILE and in
# docker-compose.observability.yml. Each product's OWN services carry their own policy, and
# formula's (formula, race-sim, paddock) still carry none — so a host reboot brings the game's
# identity and observability back but not the game. That is a gap in formula/docker-compose.yml,
# stated here so this comment does not read as a claim about the whole estate.
#
# `unless-stopped`, not `always`: a container somebody stopped on purpose stays stopped across a
# daemon restart — portal's ./e2e-saga-outage.sh depends on that, and an operator who stops the
# broker to investigate expects it to stay down.
#
# The project name is pinned to "security" in every entry compose so all three files land in
# the SAME compose project: existing dev volumes (security_pgdata & friends) survive the
# workspace split, and bringing up portal and formula together reuses one identity stack
# instead of fighting over ports.
#
# Ports on the host:
#   8080  microservice-security  (register/authenticate/verify-email/...)
#   8082  microservice-email     (POST /mails*, X-Api-Key required)
#   8091  idp                    (stub OIDC provider: social login without Google)
#   8025  Mailpit web UI         (the "inbox" for verification/reset links)
#   ----  sms / push             (internal notification channels; stub-send by default)

name: security

# The OpenTelemetry Java agent, attached to each JVM service through JAVA_TOOL_OPTIONS (no image
# rebuild) — it auto-instruments HTTP and Kafka and exports trace spans to Tempo. Per service, add
# `<<: *otel-agent` to its environment plus its own OTEL_SERVICE_NAME, and mount the agent jar.
x-otel-agent: &otel-agent
  # up-scripts export OTEL_JAVA_TOOL_OPTIONS="" when the agent jar could not be fetched:
  # a -javaagent pointing at a missing file aborts the JVM, which would crash-loop every
  # JVM service instead of "starting without tracing" (no-colon ${VAR-...} so an
  # explicitly empty value disables the agent, absence keeps it)
  JAVA_TOOL_OPTIONS: ${OTEL_JAVA_TOOL_OPTIONS--javaagent:/otel/opentelemetry-javaagent.jar}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none    # metrics already flow through Prometheus scraping
  OTEL_LOGS_EXPORTER: none       # logs already flow through Promtail -> Loki

services:
  security:
    restart: unless-stopped
    build:
      context: microservice-security
      dockerfile: security-infrastructure/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: security
      MICRONAUT_ENVIRONMENTS: dev
      DB_HOST: postgres
      DB_NAME: security
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      # mails leave as events: transactional outbox -> Kafka -> microservice-email
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # links as they appear in the mails: the verify link opens the gallery UI, which POSTs the
      # token to /verify-email (a bare GET on the API would be 405 — and side effects on GET invite
      # mail-client prefetchers to consume tokens). No reset UI yet, so that link stays raw.
      # (Dev convenience: the link points into the PORTAL product's gallery; without the portal
      # up, verify by POSTing the token straight to /verify-email — infra-smoke does exactly that.)
      VERIFY_LINK_BASE: http://localhost:8083/?verify=
      RESET_LINK_BASE: http://localhost:8080/reset-password?token=
      # the per-IP registration throttle (default 5/15min) would trip on the smoke test, which
      # registers a handful of accounts from one host in minutes — keep the guard on, but roomy
      SECURITY_REGISTRATION_MAX_PER_WINDOW: "100"
      # social login: the provider named "google" points at the stub IdP here; production swaps
      # these URLs/credentials for the real thing and the dance never changes. authorize-url is
      # what the BROWSER visits (host-published port), token/userinfo are called server-side.
      SECURITY_OAUTH_PROVIDERS_GOOGLE_ISSUER: http://localhost:8091
      SECURITY_OAUTH_PROVIDERS_GOOGLE_AUTHORIZE_URL: http://localhost:8091/authorize
      SECURITY_OAUTH_PROVIDERS_GOOGLE_TOKEN_URL: http://idp:8091/token
      SECURITY_OAUTH_PROVIDERS_GOOGLE_CLIENT_ID: demo-client
      SECURITY_OAUTH_PROVIDERS_GOOGLE_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-demo-secret}
      SECURITY_OAUTH_PROVIDERS_GOOGLE_REDIRECT_URI: http://localhost:8080/oauth/callback
      # second provider on the SAME stub, exercising the USERINFO identity source (the shape of
      # Facebook/GitHub: no id_token trusted — the access token is spent on GET /userinfo)
      SECURITY_OAUTH_PROVIDERS_GITHUB_IDENTITY_SOURCE: USERINFO
      SECURITY_OAUTH_PROVIDERS_GITHUB_AUTHORIZE_URL: http://localhost:8091/authorize
      SECURITY_OAUTH_PROVIDERS_GITHUB_TOKEN_URL: http://idp:8091/token
      SECURITY_OAUTH_PROVIDERS_GITHUB_USERINFO_URL: http://idp:8091/userinfo
      SECURITY_OAUTH_PROVIDERS_GITHUB_CLIENT_ID: demo-client
      SECURITY_OAUTH_PROVIDERS_GITHUB_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-demo-secret}
      SECURITY_OAUTH_PROVIDERS_GITHUB_REDIRECT_URI: http://localhost:8080/oauth/callback
      SECURITY_OAUTH_PROVIDERS_GITHUB_LABEL: GitHub
      SECURITY_OAUTH_ALLOWED_RETURN_PREFIXES: http://localhost:8083/,http://localhost:8084/
      # MFA SMS factor delivers codes through the shared SMS channel service (internal)
      SECURITY_SMS_URL: http://sms:8088
      # ... and authenticates to it when a key is configured. Harmless when none is: the header is
      # simply omitted, and the channel accepts as it always did (see the note beside the sms
      # service for why the shared dev stack does not enforce one).
      SECURITY_SMS_API_KEY: ${SMS_API_KEY:-}
    # A real HTTP request against /health/readiness, not just "did the JVM bind the port".
    #
    # It was a bare TCP connect until 2026-07-29, which is the shape of probe this workspace has
    # already had to replace twice: it says a process exists and nothing about whether it works.
    # Identity's own listener loop can stop — OffboardingOutcomeListener halts its container when
    # its retries are spent — while the port stays open and sign-in keeps answering, and every
    # account deletion in the portal quietly stops closing. readiness is where that shows
    # (OffboardingListenerHealth); the group, not the aggregate, for the same reason the k8s
    # manifest uses it.
    #
    # Spoken through bash's /dev/tcp because this image (eclipse-temurin) ships neither curl nor
    # wget, HTTP/1.0 so the server closes the connection itself, and the match is anchored on the
    # status line with no reason phrase — the same three tricks as memes and comments.
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /health/readiness HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "^HTTP/1.[01] 200"']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    volumes:
      - ./observability/otel:/otel:ro   # the OpenTelemetry agent (JAVA_TOOL_OPTIONS above)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  email:
    restart: unless-stopped
    build:
      context: microservice-email
    ports:
      - "8082:8080"
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: email
      MAIL_API_KEY: ${MAIL_API_KEY:-local-dev-key}
      QUARKUS_MAILER_HOST: mailpit
      QUARKUS_MAILER_PORT: "1025"
      QUARKUS_MAILER_MOCK: "false"
      # the prod profile defaults to STARTTLS=REQUIRED (real submission endpoints); Mailpit
      # speaks plain SMTP only, so the local stack opts out explicitly
      MAIL_SMTP_START_TLS: DISABLED
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      # /q/health, not a bare TCP open: THIS service's work is a Kafka channel, and the channel can
      # shut itself down with the HTTP port still listening — so a TCP probe reports a healthy mail
      # service that has stopped sending mail (see k8s/base/email.yaml for the long version).
      # Written on bash's /dev/tcp like every other probe here, because the temurin image ships no
      # curl, and it reads the STATUS LINE: Quarkus answers 503 while a channel is down.
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/localhost/8080; printf 'GET /q/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    volumes:
      - ./observability/otel:/otel:ro   # the OpenTelemetry agent (JAVA_TOOL_OPTIONS above)
    depends_on:
      mailpit:
        condition: service_started
      kafka:
        condition: service_healthy

  # stub OIDC provider: "Sign in with Google" without Google. The browser visits its authorize
  # form on the published port; security exchanges codes with it service-to-service.
  idp:
    restart: unless-stopped
    build:
      context: microservice-idp
    ports:
      - "8091:8091"   # 8090 belongs to the race sim
    environment:
      PORT: "8091"
      IDP_ISSUER: http://localhost:8091
      # Spelled out on BOTH sides of the contract rather than left to two defaults happening to
      # agree. The allowlist added on 2026-07-28 closed an open redirect (and the header split it
      # carried), but its default only matches security's default redirect_uri by coincidence —
      # and coincidences do not survive a deployment where either side is configured.
      IDP_REDIRECT_URIS: http://localhost:8080/oauth/callback
      IDP_CLIENT_ID: demo-client
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-demo-secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8091), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # notification channel stubs — shared: security's MFA SMS factor and the paddock's fan-out
  # both deliver through them; stub-send unless SMS_PROVIDER / PUSH_PROVIDER is set
  sms:
    restart: unless-stopped
    build:
      context: microservice-sms
    environment:
      # NOT set by default, and that is a correction of the same day it was added.
      #
      # Both channels can now demand X-Api-Key — that capability is real and stays. But setting the
      # key HERE turns it on for the shared identity stack, which BOTH products include, and the
      # game's paddock calls these same two services without the header (its Notifier carries an
      # api key for mail only). Enforcing it in the shared dev compose therefore answered 401 to
      # every notification the other product sent — a change in this repository silently breaking a
      # product nobody was working on.
      #
      # Enforcement belongs where each deployment owns its own secrets (k8s), not in the one file
      # two products share. Set SMS_API_KEY in the environment to switch it on locally; the
      # services stay closed to nobody until then, exactly as before 2026-07-28.
      SMS_API_KEY: ${SMS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8088), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  push:
    restart: unless-stopped
    build:
      context: microservice-push
    environment:
      PUSH_API_KEY: ${PUSH_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8089), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  kafka:
    restart: unless-stopped
    # single-node KRaft — the event backbone (mail requests, the deletion saga, thread cascades)
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  # The dead-letter topic is a LEDGER, not a tape — and until now nothing said so, so the broker's
  # default applied: records aged out after seven days. That silently broke a design that depends on
  # them lasting: microservice-email keeps its operator view of parked mail in memory and rebuilds it
  # by replaying the WHOLE topic at every start, and it retracts a re-driven mail with a record of its
  # own because Kafka has no delete. A verification, password reset or MFA code parked over a holiday
  # was therefore swept by the broker and gone from the only window anyone has onto it.
  #
  # Compaction, not infinite retention: the records are keyed by event id (see
  # MailRequestsConsumer#sendKeyed), so an unsettled mail keeps its parked record for ever while a
  # settled one collapses to its retraction — and the startup replay stays proportional to the number
  # of DISTINCT parked mails rather than to the service's entire history.
  #
  # A one-shot service rather than a line in the broker's environment, because per-topic settings are
  # not broker settings. Idempotent: creating an existing topic is tolerated, and the --alter keeps
  # an already-created one honest.
  kafka-topics-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic mail-requests-dlq --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact --config retention.ms=-1 --config min.cleanable.dirty.ratio=0.1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter \
          --entity-type topics --entity-name mail-requests-dlq \
          --add-config cleanup.policy=compact,retention.ms=-1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --describe \
          --entity-type topics --entity-name mail-requests-dlq

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit
    ports:
      - "8025:8025"   # web UI; SMTP (1025) stays internal

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: security
    volumes:
      - security_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  security_pgdata:
